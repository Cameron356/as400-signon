# systemd drop-in for getty@ttyN — AS/400 Sign On presentation
# Installed by scripts/install.sh as:
#   /etc/systemd/system/getty@ttyN.service.d/as400-signon.conf
#
# Clears the stock ExecStart, then runs agetty with:
#   --noclear     leave framebuffer as-is between respawns (Sign On clears)
#   --noissue     skip /etc/issue and /etc/issue.d (we draw our own UI)
#   --skip-login  do not prompt for username; hand the TTY to --login-program
#   --login-program  our Sign On UI → unix_chkpwd → login -f
#
# @LIBEXEC@ is substituted at install time.

[Service]
ExecStart=
ExecStart=-/sbin/agetty --noclear --noissue --skip-login --login-program @LIBEXEC@ %I $TERM
